# Production profile
spring.profiles.active=prod

# Database - Production pool settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true

# Logging - Production levels
logging.level.root=WARN
logging.level.com.voltiosyruedas=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Actuator - Production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Security
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${KEY_STORE_PATH:}
server.ssl.key-store-password=${KEY_STORE_PASSWORD:}

# OpenAPI - Disable in production or restrict
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}