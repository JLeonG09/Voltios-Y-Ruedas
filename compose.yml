# compose.yml — perfil recomendado / prod-like
# Nginx (frontend:80) es la puerta pública. Postgres, Redis y el backend
# solo viven en la red interna de Compose (sin publicar al host).
#
# Dev local (acceso directo a DB/Redis/API):
#   Añadir temporalmente ports bajo el servicio, p. ej. "5432:5432", "6379:6379", "8080:8080".
#   O usar `docker compose exec` / herramientas en la misma red.
#
# Credenciales: obligatorias vía .env (sin defaults débiles). Ver .env.example.

services:
  postgres:
    image: postgres:16-alpine
    container_name: voltios_ruedas_db
    environment:
      POSTGRES_DB: taller_db
      POSTGRES_USER: ${POSTGRES_USER:?Definir POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    # Sin ports al host (prod). Red interna: hostname "postgres".
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d taller_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voltios_ruedas_redis
    # Sin ports al host (prod). Red interna: hostname "redis".
    volumes:
      - redisdata:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/voltios_y_ruedas/Dockerfile
    container_name: voltios_ruedas_app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      POSTGRES_USER: ${POSTGRES_USER:?Definir POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-43200000}
      TZ: ${TZ:-America/Costa_Rica}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taller_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Detrás de nginx del compose: confiar en X-Forwarded-For del proxy.
      TRUST_FORWARDED_HEADERS: ${TRUST_FORWARDED_HEADERS:-true}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME:-no-reply@voltiosyruedas.com}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    # Sin 8080 al host: el tráfico público entra por nginx (frontend:80 → app:8080).
    # Healthchecks usan la red interna (localhost dentro del contenedor).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: voltios_ruedas_frontend
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  pgdata:
  redisdata:
