spring.application.name=voltios-y-ruedas
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Puerto HTTP - Render inyecta PORT y exige que la app escuche en ese puerto
server.port=${PORT:8080}

# CORS - orígenes permitidos (separados por coma). Por defecto solo orígenes
# locales de desarrollo. En producción definir CORS_ALLOWED_ORIGINS con los
# dominios reales. Si se usa "*" las credenciales (Authorization) se desactivan
# automáticamente en SecurityConfig (no es posible con un origen "*").
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://localhost:3000,http://127.0.0.1:3000}

# Base de datos - Credenciales desde variables de entorno
spring.datasource.url=jdbc:postgresql://localhost:5432/taller_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Límite de tamaño de payloads para prevenir DoS
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB
server.max-http-form-post-size=10MB

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT - Valores desde variables de entorno (JWT_SECRET es obligatorio; la app
# no arranca sin él ni con un valor corto/inseguro, ver JwtUtil.validarSecreto)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:43200000}

# Logging
logging.level.root=INFO
logging.level.com.voltiosyruedas=DEBUG
logging.level.org.springframework.security=DEBUG

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Correo (SMTP). Si MAIL_ENABLED=false o no hay host configurado, los correos
# se registran por consola (modo desarrollo) y no se envían.
# Defaults para Gmail (www.gmail.com). MAIL_USERNAME = cuenta completa (tu@gmail.com)
# y MAIL_PASSWORD = Contraseña de aplicación (App Password), no la contraseña normal.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@voltiosyruedas.com}}
# URL pública del frontend (usada en los correos, p. ej. recuperación de contraseña)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
# Confiar en X-Forwarded-For / X-Real-IP solo detrás de proxy conocido (nginx).
# false por defecto: rate limit y auditoría usan remoteAddr (anti spoofing).
app.security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
# Un SMTP con credenciales inválidas no debe marcar el contenedor unhealthy:
# el MailService ya registra el fallo por consola y sigue con normalidad.
management.health.mail.enabled=false