spring.application.name=voltios-y-ruedas
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Puerto HTTP - Render inyecta PORT y exige que la app escuche en ese puerto
server.port=${PORT:8080}

# CORS - orígenes permitidos (separados por coma). "*" permite cualquiera
# (útil detrás de nginx/ngrok donde el origen es same-origin). Para producción
# cruzar orígenes (ej. Render) configurar CORS_ALLOWED_ORIGINS con los dominios.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Base de datos - Credenciales desde variables de entorno
spring.datasource.url=jdbc:postgresql://localhost:5432/taller_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT - Valores desde variables de entorno
jwt.secret=${JWT_SECRET:min-32-caracteres-cambiar-en-produccion!!!}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Logging
logging.level.root=INFO
logging.level.com.voltiosyruedas=DEBUG
logging.level.org.springframework.security=DEBUG

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Correo (SMTP). Si MAIL_ENABLED=false o no hay host configurado, los correos
# se registran por consola (modo desarrollo) y no se envían.
# Defaults para Gmail (www.gmail.com). MAIL_USERNAME = cuenta completa (tu@gmail.com)
# y MAIL_PASSWORD = Contraseña de aplicación (App Password), no la contraseña normal.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@voltiosyruedas.com}}
# URL pública del frontend (usada en los correos, p. ej. recuperación de contraseña)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
# Un SMTP con credenciales inválidas no debe marcar el contenedor unhealthy:
# el MailService ya registra el fallo por consola y sigue con normalidad.
management.health.mail.enabled=false